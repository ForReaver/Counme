<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counme</title>
</head>
<body>
  <h1>🌍 Counme</h1>
  <p>Ülke-başkent bilgi oyunu!</p>

  <h2 id="soru">Fransa'nın başkenti neresi?</h2>
  <input id="cevap" type="text" placeholder="Cevabını yaz...">
  <button onclick="kontrolEt()">Kontrol et</button>
  <p id="sonuc"></p>
  <p id="puan">Puan: 0</p>

<script>
  const sorular = [
    { ulke: "Fransa", baskent: "Paris" },
      { ulke: "Almanya", baskent: "Berlin" },
      { ulke: "Japonya", baskent: "Tokyo" },
      { ulke: "İtalya", baskent: "Roma" },
      { ulke: "Mısır", baskent: "Kahire" }
    ];

  let sira = 0;
  let puan = 0;

  function soruyuGoster() {
    document.getElementById("soru").textContent = "Başkenti neresi: " + sorular[sira].ulke;
  }

  function kontrolEt() {
    if (sira >= sorular.length) {
      return;
    }

    let cevap = document.getElementById("cevap").value;
    cevap = cevap.trim().toLocaleLowerCase("tr");
    let dogruCevap = sorular[sira].baskent;

    if (cevap === dogruCevap.toLocaleLowerCase("tr")) {
        document.getElementById("sonuc").textContent = "✅ Doğru!";
        puan = puan + 1;
      } else {
        document.getElementById("sonuc").textContent = "❌ Yanlış, cevap " + dogruCevap + ".";
      }


    document.getElementById("puan").textContent= "Puan: " + puan;
    document.getElementById("cevap").value = "";
    sira = sira + 1;

    if (sira < sorular.length) {
      soruyuGoster();
    } else {
      document.getElementById("soru").textContent = "🎉 Oyun bitti! Puanın: " + puan + "/" + sorular.length;
    }
  }

    soruyuGoster();
  </script>
</body>
</html>
